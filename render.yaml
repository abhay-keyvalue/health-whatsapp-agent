services:
  # Frontend Static Site
  - type: web
    name: health-frontend
    env: static
    rootDir: admin-dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true

  # Backend Web Service
  - type: web
    name: health-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: health-db
          property: connectionString
      - key: WATI_API_BASE_URL
        sync: false
      - key: WATI_API_TOKEN
        sync: false
      - key: WATI_TENANT_ID
        sync: false
      - key: WATI_CHANNEL_PHONE
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false

databases:
  - name: health-db
    databaseName: healthagent
    plan: free
